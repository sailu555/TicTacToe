services:
  backend:
    build:
      context: ./backend/TicTacToe.Api
    container_name: tictactoe-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: tictactoe-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend
